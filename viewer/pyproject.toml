[project]
name = "packet-probe-viewer"
version = "0.2.0"
description = "Browser viewer and web gateway for Packet Probe event streams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Packet Probe contributors" }
]
dependencies = [
  # The gateway needs wirestead-python (import name `wirestead`). It is released as
  # GitHub wheels, not on PyPI, so install it first (see README.md).
  # "wirestead>=0.9.6",
]

[project.optional-dependencies]
test = [
  "pytest>=8"
]

[project.scripts]
packet-probe-web = "packet_probe_viewer.gateway:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packet_probe_viewer*"]

[tool.setuptools.package-data]
packet_probe_viewer = ["web/*.html"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
